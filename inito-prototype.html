/* ══ BOTTOM SHEET ══ */
function Sheet({open,onClose,children}){
  const [vis,setVis]=useState(false);
  const [anim,setAnim]=useState(false);
  useEffect(()=>{if(open){setVis(true);setTimeout(()=>setAnim(true),10);}else{setAnim(false);setTimeout(()=>setVis(false),320);};},[open]);
  if(!vis)return null;
  return(
    <div style={{position:'absolute',inset:0,zIndex:60}}>
      <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.5)',opacity:anim?1:0,transition:'opacity 300ms ease-out'}}/>
      <div style={{position:'absolute',bottom:0,left:0,right:0,background:'#fff',borderRadius:'20px 20px 0 0',transform:anim?'translateY(0)':'translateY(100%)',transition:'transform 320ms cubic-bezier(0.32,0.72,0,1)',maxHeight:'88%',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{display:'flex',justifyContent:'center',padding:'12px 0 8px',flexShrink:0}}>
          <div style={{width:36,height:4,borderRadius:2,background:'#D9D9D9'}}/>
        </div>
        <div style={{flex:1,overflowY:'auto'}} className="ns">{children}</div>
        <div style={{height:34,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><div style={{width:134,height:5,borderRadius:100,background:C.text}}/></div>
      </div>
    </div>
  );
}

/* ══ POST CARD ══ */
function PostCard({post,onAvatarClick,onNameClick,onTextClick,onLikesTap,onVotersTap,onCommentsTap,isNew=false}){
  const [liked,setLiked]=useState(false);
  const [selOpt,setSelOpt]=useState(post.poll?1:null);
  const likeCount=post.likes+(liked?1:0);

  return(
    <div style={{background:'#fff',borderBottom:`1px solid ${C.border}`,animation:isNew?'fadeIn .35s ease-out':undefined}}>
      {/* User row */}
      <div style={{display:'flex',alignItems:'flex-start',gap:8,padding:'8px 16px'}}>
        <div style={{cursor:'pointer'}} onClick={onAvatarClick||onNameClick}><Av src={post.avatar} size={44}/></div>
        <div style={{flex:1,minWidth:0,paddingTop:2}}>
          <div style={{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
            <span onClick={post.isAnon?onNameClick:onAvatarClick} style={{fontSize:14,fontWeight:590,color:C.text,cursor:'pointer',letterSpacing:'-0.07px'}}>{post.author}</span>
            <Badge type={post.badge}/>
            {post.tags?.map(t=><span key={t} style={{fontSize:11,padding:'1px 6px',borderRadius:100,background:'rgba(231,231,231,0.6)',color:C.text,letterSpacing:'-0.2px'}}>{t}</span>)}
            {post.tags&&<span style={{fontSize:12,color:C.muted}}>{post.time}</span>}
          </div>
          {!post.tags&&<div style={{fontSize:12,color:C.muted,marginTop:2}}>{post.time}</div>}
        </div>
        <button style={{background:'none',border:'none',cursor:'pointer',padding:'4px 0 0 4px',flexShrink:0}}><DotsIcon/></button>
      </div>
      {/* Text */}
      <div onClick={post.isAnon?onTextClick:undefined} style={{padding:'0 16px 8px',fontSize:14,color:C.text,lineHeight:'18px',letterSpacing:'-0.07px',cursor:post.isAnon?'pointer':'default'}}>{post.text}</div>
      {/* Chart */}
      {post.chart&&<div onClick={post.isAnon?onTextClick:undefined} style={{padding:'0 16px 8px',cursor:post.isAnon?'pointer':'default'}}><IniChart/></div>}
      {/* Poll */}
      {post.poll&&(
        <div style={{padding:'0 16px 8px',display:'flex',flexDirection:'column',gap:4}}>
          {post.poll.options.map((o,i)=>{
            const sel=selOpt===i;
            const barW=`${(o.percent/100)*357}px`;
            return(
              <div key={i} onClick={()=>setSelOpt(i)} style={{position:'relative',background:'#F9F9F9',borderRadius:12,height:48,display:'flex',alignItems:'center',gap:10,padding:'0 12px 0 8px',overflow:'hidden',cursor:'pointer'}}>
                <div style={{position:'absolute',left:0,top:0,bottom:0,width:barW,background:'#DDE9FF',opacity:sel?1:0.5,borderRadius:'12px 0 0 12px',transition:'width .3s'}}/>
                {/* Radio - real Figma assets */}
                <div style={{flexShrink:0,zIndex:1,width:20,height:20}}>
                  {sel
                    ?<img src="/radioon.svg" width="20" height="20" alt=""/>
                    :<img src="/radiooff.svg" width="20" height="20" alt=""/>
                  }
                </div>
                <span style={{flex:1,fontSize:14,color:C.text,zIndex:1,fontWeight:sel?590:400,letterSpacing:'-0.07px'}}>{o.label}</span>
                <div style={{display:'flex',alignItems:'center',gap:4,zIndex:1}}>
                  <span style={{fontSize:14,color:C.text}}>{o.percent}%</span>
                  <div onClick={e=>{e.stopPropagation();onVotersTap&&onVotersTap(o);}} style={{cursor:'pointer',padding:'6px 2px',display:'flex',alignItems:'center'}}>
                    <ChevronRight/>
                  </div>
                </div>
              </div>
            );
          })}
          <span style={{fontSize:12,color:C.gray,padding:'2px 6px',letterSpacing:'-0.048px'}}>{post.poll.voters} voters</span>
        </div>
      )}
      {/* Reactions */}
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'4px 16px 12px'}}>
        <button onClick={()=>setLiked(!liked)} style={{display:'flex',alignItems:'center',gap:3,background:'none',border:'none',cursor:'pointer',padding:0}}>
          <HeartIcon size={24} liked={liked}/>
        </button>
        <button onClick={()=>onLikesTap&&onLikesTap(likeCount)} style={{background:'none',border:'none',cursor:'pointer',padding:'0 4px 0 0',fontSize:12,color:'#444343',letterSpacing:'-0.048px'}}>{likeCount}</button>
        <button onClick={()=>onCommentsTap&&onCommentsTap(post)} style={{display:'flex',alignItems:'center',gap:4,background:'none',border:'none',cursor:'pointer',padding:0}}>
          <CommentIcon size={24}/>
          <span style={{fontSize:12,color:'#444343',letterSpacing:'-0.048px'}}>{post.commentLabel||(post.comments>0?`${post.comments} comments`:'Comment')}</span>
        </button>
      </div>
    </div>
  );
}

/* ══ REDUCER ══ */
const INIT={text:'',photos:[],isPollMode:false,pollOptions:['',''],isAnonymous:false,selectedTopics:[],newPost:null};
function reducer(s,a){
  switch(a.type){
    case 'SET_TEXT':return{...s,text:a.v};
    case 'SET_PHOTOS':return{...s,photos:a.v};
    case 'SET_POLL':return{...s,isPollMode:a.v,photos:a.v?[]:s.photos};
    case 'SET_POLL_OPTS':return{...s,pollOptions:a.v};
    case 'SET_ANON':return{...s,isAnonymous:a.v};
    case 'TOGGLE_TOPIC':{const t=s.selectedTopics;return{...s,selectedTopics:t.includes(a.v)?t.filter(x=>x!==a.v):[...t,a.v]};}
    case 'POST':return{...s,newPost:{id:Date.now(),author:s.isAnonymous?'Anonymous member':'TTCwithEmilyJourney',avatar:s.isAnonymous?null:'https://i.pravatar.cc/80?img=47',badge:null,time:'now',text:s.text||'New post',likes:0,comments:0,commentLabel:'Comment'},text:'',photos:[],isPollMode:false,pollOptions:['',''],selectedTopics:[]};
    default:return s;
  }
}

/* ══ APP ══ */
function App(){
  const [screen,setScreen]=useState('feed');
  const [state,dispatch]=useReducer(reducer,INIT);
  const [isPosting,setIsPosting]=useState(false);
  const nav=useCallback((dest)=>{
    if(dest==='feed-posting'){setIsPosting(true);setScreen('feed');setTimeout(()=>setIsPosting(false),2100);}
    else setScreen(dest);
  },[]);
  return(
    <MobileFrame>
      {screen==='feed'&&<FeedScreen nav={nav} newPost={state.newPost} isPosting={isPosting}/>}
      {screen==='newpost1'&&<NewPost1 nav={nav} state={state} dispatch={dispatch}/>}
      {screen==='newpost2'&&<NewPost2 nav={nav} state={state} dispatch={dispatch}/>}
      {screen==='photofull'&&<PhotoViewer nav={nav} photos={state.photos}/>}
      {screen==='notifications'&&<NotifScreen nav={nav}/>}
      {screen==='postremoved'&&<PostRemoved nav={nav}/>}
      {screen==='profile'&&<Profile nav={nav}/>}
      {screen==='postDetail'&&<PostDetail nav={nav} post={POSTS[1]}/>}
    </MobileFrame>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
